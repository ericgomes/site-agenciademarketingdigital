<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório da Agência de Marketing Digital</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <iframe
    id="reportFrame"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);

    const reportId =
      params.get('id') ||
      '9563661e-35c8-4dc0-b781-c55a19b09ab0';

    const title = params.get('t') || 'Relatório da Agência de Marketing Digital';
    document.title = title;

    document.getElementById('reportFrame').src =
      `https://datastudio.google.com/embed/reporting/${reportId}`;
  </script>

</body>
</html>
