<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Relatório</title>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-P2R23466');</script>
  <!-- End Google Tag Manager -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      display: block;
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: #7C3AED; }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #7C3AED;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #6D28D9; }

    .result {
      margin-top: 1.25rem;
      display: none;
    }

    .result label { margin-bottom: 0.35rem; }

    .url-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .url-text {
      flex: 1;
      padding: 0.6rem 0.85rem;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #333;
      word-break: break-all;
      line-height: 1.4;
    }

    .copy-btn {
      width: auto;
      padding: 0.6rem 1rem;
      font-size: 0.82rem;
      flex-shrink: 0;
      background: #111;
    }
    .copy-btn:hover { background: #333; }
    .copy-btn.copied { background: #16a34a; }

    .open-btn {
      display: block;
      margin-top: 0.6rem;
      text-align: center;
      font-size: 0.85rem;
      color: #7C3AED;
      text-decoration: none;
      font-weight: 600;
    }
    .open-btn:hover { text-decoration: underline; }

    .divider {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 1.75rem 0;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P2R23466"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="card">
    <h1>Novo Relatório</h1>

    <label for="inp-id">URL ou ID do Relatório</label>
    <input id="inp-id" type="text" placeholder="ex: https://datastudio.google.com/reporting/6039134d-…" />

    <label for="inp-t">Título</label>
    <input id="inp-t" type="text" placeholder="ex: Performance Junho 2026" />

    <button onclick="generate()">Gerar link</button>

    <div class="result" id="result">
      <label>URL gerada</label>
      <div class="url-box">
        <div class="url-text" id="url-display"></div>
        <button class="copy-btn" id="copy-btn" onclick="copyUrl()">Copiar</button>
      </div>
      <a class="open-btn" id="open-link" target="_blank">Abrir →</a>
    </div>

    <div class="divider"></div>

    <h1>Nova Apresentação</h1>

    <label for="inp-slides-url">URL do Google Slides</label>
    <input id="inp-slides-url" type="text" placeholder="ex: https://docs.google.com/presentation/d/…" />

    <label for="inp-slides-t">Título</label>
    <input id="inp-slides-t" type="text" placeholder="ex: Proposta Comercial Junho 2026" />

    <button onclick="generateSlides()">Gerar link</button>

    <div class="result" id="slides-result">
      <label>URL gerada</label>
      <div class="url-box">
        <div class="url-text" id="slides-url-display"></div>
        <button class="copy-btn" id="slides-copy-btn" onclick="copySlidesUrl()">Copiar</button>
      </div>
      <a class="open-btn" id="slides-open-link" target="_blank">Abrir →</a>
    </div>
  </div>

  <script>
    let generatedUrl = '';

    function extractId(raw) {
      // Full Looker Studio / Data Studio URL → extract the report UUID
      const match = raw.match(/\/reporting\/([a-f0-9\-]{36})/i);
      if (match) return match[1];
      // Already a plain ID
      return raw;
    }

    function generate() {
      const raw = document.getElementById('inp-id').value.trim();
      const t   = document.getElementById('inp-t').value.trim();

      if (!raw) {
        document.getElementById('inp-id').focus();
        return;
      }

      const id = extractId(raw);

      const base = window.location.origin + '/report/';
      const params = new URLSearchParams({ id });
      if (t) params.set('t', t);

      generatedUrl = base + '?' + params.toString();

      document.getElementById('url-display').textContent = generatedUrl;
      document.getElementById('open-link').href = generatedUrl;
      document.getElementById('result').style.display = 'block';

      const copyBtn = document.getElementById('copy-btn');
      copyBtn.textContent = 'Copiar';
      copyBtn.classList.remove('copied');
    }

    function copyUrl() {
      navigator.clipboard.writeText(generatedUrl).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // ── Google Slides ─────────────────────────────────────────
    let generatedSlidesUrl = '';

    function extractSlidesId(raw) {
      // Published embed: /presentation/d/e/{pubId}/
      const pub = raw.match(/\/presentation\/d\/e\/([A-Za-z0-9_-]+)/i);
      if (pub) return pub[1];
      // Edit / view URL: /presentation/d/{id}/
      const edit = raw.match(/\/presentation\/d\/([A-Za-z0-9_-]+)/i);
      if (edit) return edit[1];
      // Already a plain ID
      return raw.trim();
    }

    function generateSlides() {
      const raw = document.getElementById('inp-slides-url').value.trim();
      const t   = document.getElementById('inp-slides-t').value.trim();

      if (!raw) {
        document.getElementById('inp-slides-url').focus();
        return;
      }

      const id = extractSlidesId(raw);
      const base = window.location.origin + '/report/';
      const params = new URLSearchParams({ id, type: 'slides' });
      if (t) params.set('t', t);

      generatedSlidesUrl = base + '?' + params.toString();

      document.getElementById('slides-url-display').textContent = generatedSlidesUrl;
      document.getElementById('slides-open-link').href = generatedSlidesUrl;
      document.getElementById('slides-result').style.display = 'block';

      const copyBtn = document.getElementById('slides-copy-btn');
      copyBtn.textContent = 'Copiar';
      copyBtn.classList.remove('copied');
    }

    function copySlidesUrl() {
      navigator.clipboard.writeText(generatedSlidesUrl).then(() => {
        const btn = document.getElementById('slides-copy-btn');
        btn.textContent = 'Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Gera ao pressionar Enter em qualquer campo
    document.querySelectorAll('input').forEach(inp =>
      inp.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const id = inp.id;
        if (id === 'inp-slides-url' || id === 'inp-slides-t') generateSlides();
        else generate();
      })
    );
  </script>
</body>
</html>
