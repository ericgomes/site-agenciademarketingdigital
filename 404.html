  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#08000E; --accent:#9333EA; --accent-hi:#c084fc; --indigo:#818cf8;
      --text:#f5f0ff; --muted:#bba8d8; --border:rgba(160,60,255,0.18);
    }
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);
      background:
        radial-gradient(800px 500px at 20% -10%, rgba(147,51,234,0.28), transparent 60%),
        radial-gradient(700px 500px at 100% 10%, rgba(129,140,248,0.18), transparent 55%),

      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:2rem 1.25rem;text-align:center;-webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:560px}
    .code{
      font-size:clamp(5rem,20vw,10rem);font-weight:800;line-height:1;letter-spacing:-0.04em;
      background:linear-gradient(135deg,#c084fc 0%,#818cf8 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:700;letter-spacing:-0.02em;margin:.6rem 0 .8rem}
    p{font-size:1rem;line-height:1.65;color:var(--muted);max-width:44ch;margin:0 auto 2rem}
    .actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
    .btn{
      display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;font-weight:600;
      font-size:.92rem;padding:.8rem 1.5rem;border-radius:100px;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;
    }
    .btn-primary{
      background:linear-gradient(135deg,#9333EA 0%,#7C3AED 100%);color:#fff;
      box-shadow:0 6px 22px rgba(147,51,234,0.35);
    }
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(147,51,234,0.5)}
    .btn-ghost{color:var(--text);border:1px solid var(--border);background:rgba(147,51,234,0.06)}
    .btn-ghost:hover{border-color:var(--accent-hi);color:var(--accent-hi)}
    .links{margin-top:2.2rem;font-size:.85rem;color:var(--muted)}
    .links a{color:var(--accent-hi);text-decoration:none}
    .links a:hover{text-decoration:underline}
