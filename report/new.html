<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Relatório</title>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-P2R23466');</script>
  <!-- End Google Tag Manager -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.1rem;
      resize: vertical;
    }
    input:focus, textarea:focus { border-color: #7C3AED; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .badge.looker { background: #EDE9FE; color: #5B21B6; }
    .badge.slides { background: #DCFCE7; color: #15803d; }
    .badge.visible { opacity: 1; }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #7C3AED;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #6D28D9; }

    .result {
      margin-top: 1.25rem;
      display: none;
    }

    .result label { margin-bottom: 0.35rem; }

    .url-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .url-text {
      flex: 1;
      padding: 0.6rem 0.85rem;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #333;
      word-break: break-all;
      line-height: 1.4;
    }

    .copy-btn {
      width: auto;
      padding: 0.6rem 1rem;
      font-size: 0.82rem;
      flex-shrink: 0;
      background: #111;
    }
    .copy-btn:hover { background: #333; }
    .copy-btn.copied { background: #16a34a; }

    .open-btn {
      display: block;
      margin-top: 0.6rem;
      text-align: center;
      font-size: 0.85rem;
      color: #7C3AED;
      text-decoration: none;
      font-weight: 600;
    }
    .open-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P2R23466"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="card">
    <h1>Novo Relatório</h1>

    <label for="inp-src">
      URL ou código embed
      <span class="badge" id="type-badge"></span>
    </label>
    <textarea id="inp-src" rows="3"
      placeholder="Cole aqui a URL do Looker Studio, o link de publicação do Google Slides ou o &lt;iframe&gt; de embed"></textarea>

    <label for="inp-t">Título</label>
    <input id="inp-t" type="text" placeholder="ex: Performance Junho 2026" />

    <button onclick="generate()">Gerar link</button>

    <div class="result" id="result">
      <label>URL gerada</label>
      <div class="url-box">
        <div class="url-text" id="url-display"></div>
        <button class="copy-btn" id="copy-btn" onclick="copyUrl()">Copiar</button>
      </div>
      <a class="open-btn" id="open-link" target="_blank">Abrir →</a>
    </div>
  </div>

  <script>
    let generatedUrl = '';

    // Detecta o tipo e extrai o ID a partir de qualquer entrada:
    // - URL de edição/view do Looker Studio
    // - URL de edição/view do Google Slides
    // - URL de embed publicado do Google Slides (/d/e/…)
    // - <iframe src="…"> com qualquer uma das URLs acima
    // - ID puro (UUID Looker ou 2PACX-… Slides)
    function parse(raw) {
      // Se for código <iframe>, extrai o src primeiro
      const srcMatch = raw.match(/\bsrc=["']([^"']+)/i);
      const url = srcMatch ? srcMatch[1] : raw.trim();

      // Google Slides publicado: /d/e/{pubId}/
      const slidesPub = url.match(/\/presentation\/d\/e\/([A-Za-z0-9_-]+)/i);
      if (slidesPub) return { id: slidesPub[1], type: 'slides' };

      // Looker Studio / Data Studio: /reporting/{uuid}
      const looker = url.match(/\/reporting\/([a-f0-9-]{36})/i);
      if (looker) return { id: looker[1], type: 'looker' };

      // ID puro: começa com 2PACX- → Slides publicado
      if (url.startsWith('2PACX-')) return { id: url, type: 'slides' };

      // Fallback: UUID → Looker
      return { id: url, type: 'looker' };
    }

    // Atualiza o badge ao digitar
    document.getElementById('inp-src').addEventListener('input', function () {
      const val = this.value.trim();
      const badge = document.getElementById('type-badge');
      if (!val) {
        badge.className = 'badge';
        badge.textContent = '';
        return;
      }
      const { type } = parse(val);
      badge.className = `badge ${type} visible`;
      badge.textContent = type === 'slides' ? 'Google Slides' : 'Looker Studio';
    });

    function generate() {
      const raw = document.getElementById('inp-src').value.trim();
      const t   = document.getElementById('inp-t').value.trim();

      if (!raw) {
        document.getElementById('inp-src').focus();
        return;
      }

      const { id, type } = parse(raw);
      const base = window.location.origin + '/report/';
      const params = new URLSearchParams({ id });
      if (type === 'slides') params.set('type', 'slides');
      if (t) params.set('t', t);

      generatedUrl = base + '?' + params.toString();

      document.getElementById('url-display').textContent = generatedUrl;
      document.getElementById('open-link').href = generatedUrl;
      document.getElementById('result').style.display = 'block';

      const copyBtn = document.getElementById('copy-btn');
      copyBtn.textContent = 'Copiar';
      copyBtn.classList.remove('copied');
    }

    function copyUrl() {
      navigator.clipboard.writeText(generatedUrl).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Gera com Ctrl/Cmd+Enter no textarea, ou Enter normal no input de título
    document.getElementById('inp-src').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generate();
    });
    document.getElementById('inp-t').addEventListener('keydown', e => {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
