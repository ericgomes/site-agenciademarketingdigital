  <title>Apresentação</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      position: fixed;
      top: 0;
      left: 0;
    }

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P2R23466"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <iframe
    id="slidesFrame"
    allowfullscreen
    allow="autoplay">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');
    const title  = params.get('t') || 'Apresentação';

    document.title = title;

    if (id) {
      // IDs from published embeds start with "2PACX-"
      const src = id.startsWith('2PACX-')
        ? `https://docs.google.com/presentation/d/e/${id}/pubembed?start=false&loop=false&delayms=3000`
        : `https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false&delayms=3000`;

      document.getElementById('slidesFrame').src = src;
    }
  </script>
</body>
</html>
