<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-P2R23466');</script>
  <!-- End Google Tag Manager -->
  <title>Relatório da Agência de Marketing Digital</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P2R23466"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <iframe
    id="reportFrame"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);

    const id    = params.get('id');
    const type  = params.get('type') || 'looker';
    const title = params.get('t') || 'Relatório da Agência de Marketing Digital';

    document.title = title;

    if (id) {
      let src;

      if (type === 'slides') {
        src = `https://docs.google.com/presentation/d/e/${id}/pubembed?start=false&loop=false&delayms=3000`;
      } else if (type === 'docs') {
        // IDs publicados começam com "2PACX-"; demais são docs normais
        src = id.startsWith('2PACX-')
          ? `https://docs.google.com/document/d/e/${id}/pub?embedded=true`
          : `https://docs.google.com/document/d/${id}/preview`;
      } else {
        // Looker Studio (default)
        src = `https://datastudio.google.com/embed/reporting/${id}`;
      }

      document.getElementById('reportFrame').src = src;
    }
  </script>

</body>
</html>
